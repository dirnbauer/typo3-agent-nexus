services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webconsulting\AgentNexus\:
    resource: '../Classes/*'
    exclude:
      # Value objects, built by hand, never injected.
      - '../Classes/A2ui/Domain/Model/*'
      - '../Classes/Shared/Http/Api/Route.php'
      - '../Classes/Shared/Http/Api/RouteMatch.php'
      - '../Classes/Shared/Store/ProtocolObject.php'
      - '../Classes/Shared/Store/ObjectFilter.php'
      - '../Classes/Shared/Traffic/TrafficCapture.php'
      - '../Classes/Shared/Traffic/TrafficFilter.php'

  # Route handlers, backend controllers and AJAX targets declare themselves
  # public (#[AsController], #[Autoconfigure(public: true)]); the middlewares
  # are fetched from the container by class name.
  Webconsulting\AgentNexus\Shared\Http\Api\ApiRouter:
    public: true

  Webconsulting\AgentNexus\Shared\Http\Api\BackendTrafficRecorder:
    public: true

  # What the protocols need from a model, and the ledger its spend goes to.
  Webconsulting\AgentNexus\Shared\Llm\LanguageModel:
    alias: Webconsulting\AgentNexus\Shared\Llm\LlmClient

  Webconsulting\AgentNexus\Shared\Llm\UsageLedger:
    alias: Webconsulting\AgentNexus\Shared\Llm\LlmUsageTracker
