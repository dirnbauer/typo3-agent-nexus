settings:
  agentNexus.storagePid:
    label: 'Storage folder'
    description: >-
      Page uid of the folder that holds the protocol objects the frontend
      widgets create (A2UI surfaces and submitted data, AG-UI runs and leads,
      A2A tasks, UCP checkout sessions, AP2 mandates). The agentnexus:seed-site
      command creates this folder and writes the uid here. 0 stores every
      object on the page that created it.
    type: int
    default: 0
    category: agentNexus

  agentNexus.showProtocolInfo:
    label: 'Show the protocol info element by default'
    description: >-
      Preselects the "diagram, endpoints and how it works" sections on newly
      created Protocol info elements. Editors can still override this per
      element in the plugin's FlexForm.
    type: bool
    default: true
    category: agentNexus

categories:
  agentNexus:
    label: 'Agent Nexus'
