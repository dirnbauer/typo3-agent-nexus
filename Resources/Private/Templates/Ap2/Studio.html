<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
<div class="anx anx--backend anx-accent--ap2 anx-ap2"
     data-ap2-studio
     data-authorize-url="{authorizeUrl}"
     data-inspector-url="{inspectorUri}">

    <h1><f:translate domain="agent_nexus.ap2" key="studio.heading" /></h1>
    <p class="anx-lede"><f:translate domain="agent_nexus.ap2" key="studio.lede" /></p>

    <f:be.infobox title="{f:translate(domain: 'agent_nexus.ap2', key: 'studio.sandbox.title')}" state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}">
        <p><f:translate domain="agent_nexus.ap2" key="studio.sandbox" /></p>
        <p class="anx-ap2__links">
            <a class="btn btn-default btn-sm" href="{jwksUrl}" target="_blank" rel="noopener">
                <core:icon identifier="actions-key" size="small" />
                <f:translate domain="agent_nexus.ap2" key="studio.jwks" />
            </a>
            <f:if condition="{frontendUrl}">
                <a class="btn btn-default btn-sm" href="{frontendUrl}" target="_blank" rel="noopener">
                    <core:icon identifier="actions-window-open" size="small" />
                    <f:translate domain="agent_nexus.ap2" key="studio.demo" />
                </a>
            </f:if>
        </p>
    </f:be.infobox>

    <div class="anx-stats" role="group" aria-label="{f:translate(domain: 'agent_nexus.ap2', key: 'stats.label')}">
        <div class="anx-stat">
            <span class="anx-stat__value">{stats.issued}</span>
            <span class="anx-stat__label"><f:translate domain="agent_nexus.ap2" key="stats.issued" /></span>
        </div>
        <div class="anx-stat">
            <span class="anx-stat__value">{stats.verified}</span>
            <span class="anx-stat__label"><f:translate domain="agent_nexus.ap2" key="stats.verified" /></span>
        </div>
        <div class="anx-stat">
            <span class="anx-stat__value">{stats.rejected}</span>
            <span class="anx-stat__label"><f:translate domain="agent_nexus.ap2" key="stats.rejected" /></span>
        </div>
    </div>

    <div class="anx-ap2__pair">
        <section class="card" aria-labelledby="anx-ap2-mint">
            <div class="card-header">
                <h2 class="card-title h4" id="anx-ap2-mint"><f:translate domain="agent_nexus.ap2" key="mint.heading" /></h2>
            </div>
            <div class="card-body">
                <form data-ap2-mint novalidate>
                    <div class="form-group">
                        <label class="form-label" for="anx-ap2-type"><f:translate domain="agent_nexus.ap2" key="mint.type" /></label>
                        <select class="form-select" id="anx-ap2-type" name="type" data-ap2-type>
                            <f:for each="{types}" as="type">
                                <option value="{type.key}"><f:translate domain="agent_nexus.ap2" key="type.{type.key}" /> ({type.vct})</option>
                            </f:for>
                        </select>
                    </div>

                    <fieldset class="form-group" data-ap2-field="signer" hidden>
                        <legend class="form-label"><f:translate domain="agent_nexus.ap2" key="mint.signer" /></legend>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="signer" id="anx-ap2-signer-ts" value="trusted-surface" checked="checked" />
                            <label class="form-check-label" for="anx-ap2-signer-ts"><f:translate domain="agent_nexus.ap2" key="mint.signer.trustedSurface" /></label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="signer" id="anx-ap2-signer-agent" value="shopping-agent" />
                            <label class="form-check-label" for="anx-ap2-signer-agent"><f:translate domain="agent_nexus.ap2" key="mint.signer.agent" /></label>
                        </div>
                    </fieldset>

                    <fieldset class="form-group" data-ap2-field="items" aria-describedby="anx-ap2-items-hint">
                        <legend class="form-label"><f:translate domain="agent_nexus.ap2" key="mint.items" /></legend>
                        <f:for each="{items}" as="item" iteration="loop">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="items" id="anx-ap2-item-{loop.index}" value="{item.id}" {f:if(condition: loop.isFirst, then: 'checked="checked"')} />
                                <label class="form-check-label" for="anx-ap2-item-{loop.index}">{item.title} <span class="text-variant">{item.priceText}</span></label>
                            </div>
                        </f:for>
                        <p class="form-text" id="anx-ap2-items-hint"><f:translate domain="agent_nexus.ap2" key="mint.items.hint" /></p>
                    </fieldset>

                    <div class="form-group" data-ap2-field="cap" hidden>
                        <label class="form-label" for="anx-ap2-cap"><f:translate domain="agent_nexus.ap2" key="mint.cap" /></label>
                        <input class="form-control" type="text" inputmode="decimal" id="anx-ap2-cap" name="cap" value="{defaultCap}" />
                    </div>

                    <div class="form-group" data-ap2-field="merchant">
                        <label class="form-label" for="anx-ap2-merchant"><f:translate domain="agent_nexus.ap2" key="mint.merchant" /></label>
                        <select class="form-select" id="anx-ap2-merchant" name="merchant" aria-describedby="anx-ap2-merchant-hint">
                            <f:for each="{merchants}" as="merchant">
                                <option value="{merchant.id}">{merchant.name} ({merchant.id})</option>
                            </f:for>
                        </select>
                        <p class="form-text" id="anx-ap2-merchant-hint"><f:translate domain="agent_nexus.ap2" key="mint.merchant.hint" /></p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="anx-ap2-expires"><f:translate domain="agent_nexus.ap2" key="mint.expires" /></label>
                        <input class="form-control anx-ap2__narrow" type="number" min="1" max="1440" step="1" id="anx-ap2-expires" name="expires" value="60" />
                    </div>

                    <div class="form-group" data-ap2-field="linked" hidden>
                        <label class="form-label" for="anx-ap2-linked"><f:translate domain="agent_nexus.ap2" key="mint.linked" /></label>
                        <textarea class="form-control anx-ap2__token-input" id="anx-ap2-linked" name="linked" rows="3" spellcheck="false" aria-describedby="anx-ap2-linked-hint"></textarea>
                        <p class="form-text" id="anx-ap2-linked-hint"><f:translate domain="agent_nexus.ap2" key="mint.linked.hint" /></p>
                    </div>

                    <div class="form-group" data-ap2-field="transaction" hidden>
                        <label class="form-label" for="anx-ap2-transaction"><f:translate domain="agent_nexus.ap2" key="mint.transaction" /></label>
                        <input class="form-control anx-ap2__token-input" type="text" id="anx-ap2-transaction" name="transaction" spellcheck="false" aria-describedby="anx-ap2-transaction-hint" />
                        <p class="form-text" id="anx-ap2-transaction-hint"><f:translate domain="agent_nexus.ap2" key="mint.transaction.hint" /></p>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <core:icon identifier="actions-document-add" size="small" />
                        <f:translate domain="agent_nexus.ap2" key="mint.submit" />
                    </button>
                </form>
            </div>
        </section>

        <section class="card" aria-labelledby="anx-ap2-output">
            <div class="card-header">
                <h2 class="card-title h4" id="anx-ap2-output"><f:translate domain="agent_nexus.ap2" key="output.heading" /></h2>
            </div>
            <div class="card-body" aria-live="polite" data-ap2-output>
                <p class="text-variant"><f:translate domain="agent_nexus.ap2" key="output.empty" /></p>
            </div>
        </section>
    </div>

    <section class="card" aria-labelledby="anx-ap2-verify">
        <div class="card-header">
            <h2 class="card-title h4" id="anx-ap2-verify"><f:translate domain="agent_nexus.ap2" key="verify.heading" /></h2>
        </div>
        <div class="card-body">
            <form data-ap2-verify novalidate>
                <div class="form-group">
                    <label class="form-label" for="anx-ap2-verify-input"><f:translate domain="agent_nexus.ap2" key="verify.input" /></label>
                    <textarea class="form-control anx-ap2__token-input" id="anx-ap2-verify-input" name="token" rows="5" spellcheck="false" aria-describedby="anx-ap2-verify-hint"></textarea>
                    <p class="form-text" id="anx-ap2-verify-hint"><f:translate domain="agent_nexus.ap2" key="verify.input.hint" /> <f:translate domain="agent_nexus.ap2" key="verify.dryRun" /></p>
                </div>
                <button type="submit" class="btn btn-primary">
                    <core:icon identifier="actions-check" size="small" />
                    <f:translate domain="agent_nexus.ap2" key="verify.submit" />
                </button>
            </form>
            <div class="anx-ap2__results" aria-live="polite" data-ap2-verify-results></div>
        </div>
    </section>

    <section class="card" aria-labelledby="anx-ap2-flow">
        <div class="card-header">
            <h2 class="card-title h4" id="anx-ap2-flow"><f:translate domain="agent_nexus.ap2" key="flow.heading" /></h2>
        </div>
        <div class="card-body">
            <p><f:translate domain="agent_nexus.ap2" key="flow.lede" /></p>
            <form class="anx-ap2__flow-form" data-ap2-flow novalidate>
                <div class="form-group">
                    <label class="form-label" for="anx-ap2-flow-cap"><f:translate domain="agent_nexus.ap2" key="mint.cap" /></label>
                    <input class="form-control anx-ap2__narrow" type="text" inputmode="decimal" id="anx-ap2-flow-cap" name="cap" value="{defaultCap}" />
                </div>
                <fieldset class="form-group">
                    <legend class="form-label"><f:translate domain="agent_nexus.ap2" key="flow.scenario" /></legend>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="intent" id="anx-ap2-flow-within" value="within" checked="checked" />
                        <label class="form-check-label" for="anx-ap2-flow-within"><f:translate domain="agent_nexus.ap2" key="flow.within" /></label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="intent" id="anx-ap2-flow-over" value="over" />
                        <label class="form-check-label" for="anx-ap2-flow-over"><f:translate domain="agent_nexus.ap2" key="flow.over" /></label>
                    </div>
                </fieldset>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">
                        <core:icon identifier="actions-play" size="small" />
                        <f:translate domain="agent_nexus.ap2" key="flow.submit" />
                    </button>
                </div>
            </form>
            <div class="anx-ap2__results" aria-live="polite" data-ap2-flow-results></div>
        </div>
    </section>

    <div class="anx-ap2__pair">
        <section aria-labelledby="anx-ap2-keys">
            <h2 id="anx-ap2-keys"><f:translate domain="agent_nexus.ap2" key="keys.heading" /></h2>
            <p class="text-variant"><f:translate domain="agent_nexus.ap2" key="keys.lede" /></p>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <caption class="visually-hidden"><f:translate domain="agent_nexus.ap2" key="keys.caption" /></caption>
                    <thead>
                        <tr>
                            <th scope="col"><f:translate domain="agent_nexus.ap2" key="keys.role" /></th>
                            <th scope="col"><f:translate domain="agent_nexus.ap2" key="keys.kid" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{keys}" as="key">
                            <tr>
                                <td><f:translate domain="agent_nexus.ap2" key="role.{key.role}" /></td>
                                <td><code>{key.kid}</code></td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </section>

        <section aria-labelledby="anx-ap2-recent">
            <h2 id="anx-ap2-recent"><f:translate domain="agent_nexus.ap2" key="recent.heading" /></h2>
            <f:if condition="{recent}">
                <f:then>
                    <div class="table-fit">
                        <table class="table table-striped table-hover">
                            <caption class="visually-hidden"><f:translate domain="agent_nexus.ap2" key="recent.caption" /></caption>
                            <thead>
                                <tr>
                                    <th scope="col"><f:translate domain="agent_nexus.ap2" key="recent.label" /></th>
                                    <th scope="col"><f:translate domain="agent_nexus.ap2" key="recent.role" /></th>
                                    <th scope="col"><f:translate domain="agent_nexus.ap2" key="recent.state" /></th>
                                    <th scope="col"><f:translate domain="agent_nexus.ap2" key="recent.updated" /></th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{recent}" as="row">
                                    <tr>
                                        <td><a href="{row.detailUri}">{row.label}</a></td>
                                        <td>{row.role}</td>
                                        <td><span class="badge badge-{row.stateBadge}"><f:translate domain="agent_nexus.ap2" key="state.{row.state}" /></span></td>
                                        <td><time datetime="{f:format.date(date: '@{row.updated}', format: 'c')}"><f:format.date format="Y-m-d H:i">@{row.updated}</f:format.date></time></td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                    </div>
                    <a class="btn btn-default btn-sm" href="{inspectorUri}">
                        <core:icon identifier="agentnexus-module-inspector" size="small" />
                        <f:translate domain="agent_nexus.ap2" key="recent.all" />
                    </a>
                </f:then>
                <f:else>
                    <div class="anx-empty">
                        <core:icon identifier="agentnexus-module-ap2" size="large" />
                        <p class="anx-empty__title"><f:translate domain="agent_nexus.ap2" key="recent.empty" /></p>
                        <p><f:translate domain="agent_nexus.ap2" key="recent.empty.action" /></p>
                    </div>
                </f:else>
            </f:if>
        </section>
    </div>
</div>
</f:section>

</html>
