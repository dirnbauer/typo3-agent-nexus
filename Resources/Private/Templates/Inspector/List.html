<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
<div class="anx anx--backend anx-inspector anx-accent--{protocol}">

    <h1><f:translate domain="agent_nexus.inspector" key="list.heading.{kind}" /></h1>
    <p class="anx-lede"><f:translate domain="agent_nexus.inspector" key="list.lede.{kind}" /></p>

    <form method="get" action="{listUri}" class="anx-inspector__filter" role="search"
          aria-label="{f:translate(domain: 'agent_nexus.inspector', key: 'filter.label')}">
        <f:for each="{listHiddenFields}" as="value" key="name">
            <input type="hidden" name="{name}" value="{value}" />
        </f:for>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="anx-inspector-state"><f:translate domain="agent_nexus.inspector" key="filter.state" /></label>
                <select class="form-select" id="anx-inspector-state" name="state">
                    <option value=""><f:translate domain="agent_nexus.inspector" key="filter.any" /></option>
                    <f:for each="{states}" as="state">
                        <option value="{state}" {f:if(condition: '{filter.state} == {state}', then: 'selected')}>{state}</option>
                    </f:for>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="anx-inspector-source"><f:translate domain="agent_nexus.inspector" key="filter.source" /></label>
                <select class="form-select" id="anx-inspector-source" name="source">
                    <option value=""><f:translate domain="agent_nexus.inspector" key="filter.any" /></option>
                    <f:for each="{sources}" as="source">
                        <option value="{source}" {f:if(condition: '{filter.source.value} == {source}', then: 'selected')}><f:translate domain="agent_nexus.inspector" key="source.{source}" /></option>
                    </f:for>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="anx-inspector-search"><f:translate domain="agent_nexus.inspector" key="filter.search" /></label>
                <input class="form-control" type="search" id="anx-inspector-search" name="search" value="{filter.search}"
                       placeholder="{f:translate(domain: 'agent_nexus.inspector', key: 'filter.search.placeholder')}" />
            </div>
            <f:if condition="{filter.contextId}">
                <input type="hidden" name="context" value="{filter.contextId}" />
            </f:if>
            <div class="form-group anx-inspector__filter-actions">
                <button type="submit" class="btn btn-default">
                    <core:icon identifier="actions-filter" size="small" />
                    <f:translate domain="agent_nexus.inspector" key="filter.apply" />
                </button>
                <f:if condition="{filterActive}">
                    <a class="btn btn-link" href="{listUri}"><f:translate domain="agent_nexus.inspector" key="filter.reset" /></a>
                </f:if>
            </div>
        </div>
    </form>

    <f:if condition="{rows}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <caption class="visually-hidden"><f:translate domain="agent_nexus.inspector" key="table.caption" /></caption>
                    <thead>
                        <tr>
                            <th scope="col"><f:translate domain="agent_nexus.inspector" key="table.object" /></th>
                            <th scope="col"><f:translate domain="agent_nexus.inspector" key="table.label" /></th>
                            <th scope="col"><f:translate domain="agent_nexus.inspector" key="table.state" /></th>
                            <th scope="col"><f:translate domain="agent_nexus.inspector" key="table.source" /></th>
                            <th scope="col"><f:translate domain="agent_nexus.inspector" key="table.context" /></th>
                            <th scope="col"><f:translate domain="agent_nexus.inspector" key="table.updated" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{rows}" as="row">
                            <tr>
                                <td>
                                    <a href="{row.detailUri}" title="{f:translate(domain: 'agent_nexus.inspector', key: 'table.open', arguments: '{0: row.objectId}')}">
                                        <code>{row.objectId}</code>
                                    </a>
                                </td>
                                <td>{row.label}</td>
                                <td><span class="badge badge-{row.stateBadge}">{row.state}</span></td>
                                <td><f:if condition="{row.source}"><f:translate domain="agent_nexus.inspector" key="source.{row.source}" /></f:if></td>
                                <td><f:if condition="{row.contextId}"><code class="anx-inspector__context">{row.contextId}</code></f:if></td>
                                <td><time datetime="{f:format.date(date: '@{row.updated}', format: 'c')}"><f:format.date format="Y-m-d H:i:s">@{row.updated}</f:format.date></time></td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
            <f:render partial="Backend/Pagination" arguments="{paginator: paginator, pagination: pagination, route: route, arguments: filterArguments, domain: 'agent_nexus.inspector'}" />
        </f:then>
        <f:else>
            <div class="anx-empty">
                <core:icon identifier="agentnexus-module-{protocol}" size="large" />
                <p class="anx-empty__title"><f:translate domain="agent_nexus.inspector" key="empty.title" /></p>
                <p>
                    <f:if condition="{filterActive}">
                        <f:then><f:translate domain="agent_nexus.inspector" key="empty.filtered" /></f:then>
                        <f:else><f:translate domain="agent_nexus.inspector" key="empty.message.{kind}" /></f:else>
                    </f:if>
                </p>
            </div>
        </f:else>
    </f:if>

</div>
</f:section>

</html>
