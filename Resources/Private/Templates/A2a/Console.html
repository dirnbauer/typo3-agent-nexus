<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
<div class="anx anx--backend anx-accent--a2a anx-a2a"
     data-a2a-console
     data-jsonrpc-url="{jsonRpcUrl}"
     data-card-url="{cardUrl}"
     data-inspector-url="{inspectorUri}">

    <h1><f:translate domain="agent_nexus.a2a" key="console.heading" /></h1>
    <p class="anx-lede"><f:translate domain="agent_nexus.a2a" key="console.lede" /></p>
    <p class="visually-hidden" aria-live="polite" data-a2a-announce></p>

    <f:be.infobox title="{f:translate(domain: 'agent_nexus.a2a', key: 'console.note.title')}" state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}">
        <p><f:translate domain="agent_nexus.a2a" key="console.note" /></p>
        <f:if condition="{demoUrl}">
            <p><a class="btn btn-default btn-sm" href="{demoUrl}" target="_blank" rel="noopener"><core:icon identifier="actions-window-open" size="small" /> <f:translate domain="agent_nexus.a2a" key="console.demo" /></a></p>
        </f:if>
    </f:be.infobox>

    <div class="anx-a2a__setup">
        <section class="card anx-a2a__compose" aria-labelledby="anx-a2a-compose">
            <div class="card-header">
                <h2 class="card-title h4" id="anx-a2a-compose"><f:translate domain="agent_nexus.a2a" key="compose.heading" /></h2>
            </div>
            <div class="card-body">
                <form data-a2a-form novalidate>
                    <fieldset class="form-group">
                        <legend class="form-label"><f:translate domain="agent_nexus.a2a" key="compose.skill" /></legend>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="anx-a2a-skill" id="anx-a2a-skill-auto" value="" checked="checked" aria-describedby="anx-a2a-skill-hint" />
                            <label class="form-check-label" for="anx-a2a-skill-auto">
                                <f:translate domain="agent_nexus.a2a" key="compose.skill.auto" />
                                <span class="text-variant"><f:translate domain="agent_nexus.a2a" key="compose.skill.auto.hint" /></span>
                            </label>
                        </div>
                        <f:for each="{skills}" as="skill">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="anx-a2a-skill" id="anx-a2a-skill-{skill.id}" value="{skill.id}" data-example="{skill.examples.0}" aria-describedby="anx-a2a-skill-hint" />
                                <label class="form-check-label" for="anx-a2a-skill-{skill.id}">
                                    {skill.name}
                                    <span class="text-variant">{skill.description}</span>
                                </label>
                            </div>
                        </f:for>
                        <p class="form-text" id="anx-a2a-skill-hint"><f:translate domain="agent_nexus.a2a" key="compose.skill.hint" /></p>
                    </fieldset>

                    <div class="form-group">
                        <label class="form-label" for="anx-a2a-message"><f:translate domain="agent_nexus.a2a" key="compose.message" /></label>
                        <textarea class="form-control" id="anx-a2a-message" rows="2" required="required" aria-describedby="anx-a2a-message-hint" data-a2a-text>{skills.0.examples.0}</textarea>
                        <p class="form-text" id="anx-a2a-message-hint"><f:translate domain="agent_nexus.a2a" key="compose.message.hint" /></p>
                    </div>

                    <div class="anx-a2a__options">
                        <div class="form-group">
                            <label class="form-label" for="anx-a2a-method"><f:translate domain="agent_nexus.a2a" key="compose.method" /></label>
                            <select class="form-select" id="anx-a2a-method" data-a2a-method>
                                <option value="SendStreamingMessage"><f:translate domain="agent_nexus.a2a" key="compose.method.stream" /></option>
                                <option value="SendMessage"><f:translate domain="agent_nexus.a2a" key="compose.method.send" /></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="anx-a2a-version"><f:translate domain="agent_nexus.a2a" key="compose.version" /></label>
                            <select class="form-select" id="anx-a2a-version" data-a2a-version>
                                <option value="1.0"><f:translate domain="agent_nexus.a2a" key="compose.version.v10" /></option>
                                <option value="0.3"><f:translate domain="agent_nexus.a2a" key="compose.version.v03" /></option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" data-a2a-send>
                        <core:icon identifier="actions-play" size="small" />
                        <f:translate domain="agent_nexus.a2a" key="compose.send" />
                    </button>
                </form>
            </div>
        </section>

        <section class="card anx-a2a__card" aria-labelledby="anx-a2a-card">
            <div class="card-header">
                <h2 class="card-title h4" id="anx-a2a-card"><f:translate domain="agent_nexus.a2a" key="card.heading" /></h2>
            </div>
            <div class="card-body" data-a2a-card aria-live="polite" aria-busy="true">
                <p class="text-variant"><f:translate domain="agent_nexus.a2a" key="card.loading" /></p>
            </div>
            <div class="card-footer anx-a2a__card-footer">
                <span class="text-variant"><f:translate domain="agent_nexus.a2a" key="card.publishedAt" /></span>
                <code>{cardUrl}</code>
                <a class="btn btn-default btn-sm" href="{cardScreenUri}"><core:icon identifier="actions-eye" size="small" /> <f:translate domain="agent_nexus.a2a" key="card.view" /></a>
            </div>
        </section>
    </div>

    <div class="anx-a2a__run">
        <section class="card anx-a2a__task" aria-labelledby="anx-a2a-task" data-a2a-task>
            <div class="card-header anx-a2a__task-header">
                <h2 class="card-title h4" id="anx-a2a-task"><f:translate domain="agent_nexus.a2a" key="task.heading" /></h2>
                <span class="badge badge-default" data-a2a-state><f:translate domain="agent_nexus.a2a" key="task.none" /></span>
            </div>
            <div class="card-body">
                <p class="text-variant" data-a2a-task-empty><f:translate domain="agent_nexus.a2a" key="task.empty" /></p>
                <dl class="anx-dl" data-a2a-facts hidden>
                    <div><dt><f:translate domain="agent_nexus.a2a" key="task.id" /></dt><dd><code data-a2a-task-id></code></dd></div>
                    <div><dt><f:translate domain="agent_nexus.a2a" key="task.context" /></dt><dd><code data-a2a-context-id></code></dd></div>
                    <div><dt><f:translate domain="agent_nexus.a2a" key="task.skill" /></dt><dd data-a2a-skill></dd></div>
                </dl>
                <p class="anx-a2a__status" data-a2a-status aria-live="polite"></p>

                <form class="anx-a2a__answer" data-a2a-answer hidden novalidate>
                    <label class="form-label" for="anx-a2a-answer" data-a2a-question><f:translate domain="agent_nexus.a2a" key="task.answer" /></label>
                    <div class="input-group">
                        <input class="form-control" type="text" id="anx-a2a-answer" autocomplete="off" />
                        <button type="submit" class="btn btn-primary"><f:translate domain="agent_nexus.a2a" key="task.answer.send" /></button>
                    </div>
                </form>

                <div class="anx-a2a__artifact" data-a2a-artifact hidden>
                    <h3 class="h5"><f:translate domain="agent_nexus.a2a" key="task.artifact" />: <code data-a2a-artifact-name></code></h3>
                    <pre class="anx-code anx-code--wrap" tabindex="0"><code data-a2a-artifact-body></code></pre>
                    <p class="text-variant" data-a2a-artifact-source></p>
                </div>

                <div class="anx-a2a__actions">
                    <button type="button" class="btn btn-default" data-a2a-get disabled="disabled">
                        <core:icon identifier="actions-refresh" size="small" />
                        <f:translate domain="agent_nexus.a2a" key="task.get" />
                    </button>
                    <button type="button" class="btn btn-default" data-a2a-cancel disabled="disabled">
                        <core:icon identifier="actions-close" size="small" />
                        <f:translate domain="agent_nexus.a2a" key="task.cancel" />
                    </button>
                    <a class="btn btn-link" href="{inspectorUri}" data-a2a-inspect hidden>
                        <core:icon identifier="agentnexus-module-inspector" size="small" />
                        <f:translate domain="agent_nexus.a2a" key="task.inspect" />
                    </a>
                </div>
            </div>
        </section>

        <section class="anx-console anx-a2a__frames" aria-labelledby="anx-a2a-frames">
            <div class="anx-console__bar">
                <h2 class="anx-console__title" id="anx-a2a-frames"><f:translate domain="agent_nexus.a2a" key="frames.heading" /></h2>
                <span class="anx-console__bar-spacer"></span>
                <span class="badge badge-default" data-a2a-framecount>0</span>
                <button type="button" class="btn btn-default btn-sm" data-a2a-clear><f:translate domain="agent_nexus.a2a" key="frames.clear" /></button>
            </div>
            <p class="anx-console__empty" data-a2a-frames-empty><f:translate domain="agent_nexus.a2a" key="frames.empty" /></p>
            <ol class="anx-events anx-a2a__events" data-a2a-frames></ol>
        </section>
    </div>

    <section class="anx-section" aria-labelledby="anx-a2a-recent">
        <h2 id="anx-a2a-recent"><f:translate domain="agent_nexus.a2a" key="recent.heading" /></h2>
        <f:if condition="{recent}">
            <f:then>
                <p class="text-variant"><f:translate domain="agent_nexus.a2a" key="recent.lede" /></p>
                <div class="table-fit">
                    <table class="table table-striped table-hover">
                        <caption class="visually-hidden"><f:translate domain="agent_nexus.a2a" key="recent.caption" /></caption>
                        <thead>
                            <tr>
                                <th scope="col"><f:translate domain="agent_nexus.a2a" key="recent.task" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.a2a" key="recent.skill" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.a2a" key="recent.state" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.a2a" key="recent.source" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.a2a" key="recent.updated" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{recent}" as="row">
                                <tr>
                                    <td>
                                        <a href="{row.detailUri}" title="{f:translate(domain: 'agent_nexus.a2a', key: 'recent.open', arguments: '{0: row.objectId}')}">
                                            <code>{row.objectId}</code>
                                        </a>
                                    </td>
                                    <td>{row.label}</td>
                                    <td><span class="badge badge-{row.stateBadge}"><f:translate domain="agent_nexus.a2a" key="state.{row.state}" default="{row.state}" /></span></td>
                                    <td><f:if condition="{row.source}"><f:translate domain="agent_nexus.inspector" key="source.{row.source}" default="{row.source}" /></f:if></td>
                                    <td><time datetime="{f:format.date(date: '@{row.updated}', format: 'c')}"><f:format.date format="Y-m-d H:i:s">@{row.updated}</f:format.date></time></td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
                <p><a class="btn btn-default" href="{inspectorUri}"><core:icon identifier="agentnexus-module-inspector" size="small" /> <f:translate domain="agent_nexus.a2a" key="recent.all" /></a></p>
            </f:then>
            <f:else>
                <div class="anx-empty">
                    <core:icon identifier="agentnexus-module-a2a" size="large" />
                    <p class="anx-empty__title"><f:translate domain="agent_nexus.a2a" key="recent.empty.title" /></p>
                    <p><f:translate domain="agent_nexus.a2a" key="recent.empty.text" /></p>
                    <a class="btn btn-primary" href="#anx-a2a-message"><f:translate domain="agent_nexus.a2a" key="recent.empty.action" /></a>
                </div>
            </f:else>
        </f:if>
    </section>
</div>
</f:section>

</html>
