<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
<div class="anx anx--backend anx-accent--agui agui-console"
     data-agui-console
     data-run-url="{runUrl}"
     data-endpoint="{endpoint}"
     data-protocol-version="{protocolVersion}">

    <h1><f:translate domain="agent_nexus.agui" key="console.heading" /></h1>
    <p class="anx-lede"><f:translate domain="agent_nexus.agui" key="console.lede" /></p>

    <form class="card agui-console__form" data-agui-form>
        <div class="card-body">
            <div class="agui-console__fields">
                <div class="form-group">
                    <label class="form-label" for="agui-preset"><f:translate domain="agent_nexus.agui" key="console.task" /></label>
                    <select class="form-select" id="agui-preset" name="preset" data-agui-preset aria-describedby="agui-preset-hint">
                        <optgroup label="{f:translate(domain: 'agent_nexus.agui', key: 'console.group.editor')}">
                            <f:for each="{editorPresets}" as="preset">
                                <option value="{preset.id}" data-audience="editor" data-message="{preset.message}"><f:translate domain="agent_nexus.agui" key="preset.{preset.id}" /></option>
                            </f:for>
                        </optgroup>
                        <optgroup label="{f:translate(domain: 'agent_nexus.agui', key: 'console.group.site')}">
                            <f:for each="{sitePresets}" as="preset">
                                <option value="{preset.id}" data-audience="site" data-message="{preset.message}"><f:translate domain="agent_nexus.agui" key="preset.{preset.id}" /></option>
                            </f:for>
                        </optgroup>
                    </select>
                    <p class="form-text" id="agui-preset-hint" data-agui-target>
                        <f:translate domain="agent_nexus.agui" key="console.target.editor" />
                    </p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="agui-message"><f:translate domain="agent_nexus.agui" key="console.message" /></label>
                    <textarea class="form-control" id="agui-message" name="message" rows="2" required data-agui-message></textarea>
                </div>
            </div>
            <div class="agui-console__actions">
                <button type="submit" class="btn btn-primary" data-agui-start>
                    <core:icon identifier="actions-play" size="small" />
                    <f:translate domain="agent_nexus.agui" key="console.start" />
                </button>
                <button type="button" class="btn btn-default" data-agui-clear>
                    <core:icon identifier="actions-edit-delete" size="small" />
                    <f:translate domain="agent_nexus.agui" key="console.clear" />
                </button>
                <p class="agui-console__status" role="status" data-agui-status></p>
            </div>
        </div>
    </form>

    <div class="agui-console__columns">
        <section class="agui-console__stream" aria-labelledby="agui-events-heading">
            <div class="agui-console__section-head">
                <h2 id="agui-events-heading"><f:translate domain="agent_nexus.agui" key="console.events" /></h2>
                <span class="badge badge-default" data-agui-count>0</span>
            </div>
            <p class="text-variant" data-agui-events-empty><f:translate domain="agent_nexus.agui" key="console.events.empty" /></p>
            <ol class="anx-events" data-agui-events aria-labelledby="agui-events-heading"></ol>
        </section>

        <div class="agui-console__side">
            <section class="card" aria-labelledby="agui-answer-heading">
                <div class="card-header">
                    <h2 class="card-title" id="agui-answer-heading"><f:translate domain="agent_nexus.agui" key="console.answer" /></h2>
                </div>
                <div class="card-body" aria-live="polite">
                    <p class="agui-console__provenance" data-agui-provenance hidden></p>
                    <details class="agui-console__reasoning" data-agui-reasoning hidden>
                        <summary><f:translate domain="agent_nexus.agui" key="console.reasoning" /></summary>
                        <p data-agui-reasoning-text></p>
                    </details>
                    <p class="agui-console__answer" data-agui-answer><span class="text-variant"><f:translate domain="agent_nexus.agui" key="console.answer.empty" /></span></p>
                    <p data-agui-result hidden></p>
                </div>
            </section>

            <section class="card agui-console__interrupt" data-agui-interrupt hidden aria-labelledby="agui-interrupt-heading">
                <div class="card-header">
                    <h2 class="card-title" id="agui-interrupt-heading"><f:translate domain="agent_nexus.agui" key="console.interrupt" /></h2>
                </div>
                <div class="card-body">
                    <p data-agui-interrupt-message></p>
                    <dl class="anx-dl anx-dl--compact" data-agui-interrupt-facts></dl>
                    <form data-agui-interrupt-form novalidate>
                        <div data-agui-interrupt-fields></div>
                        <div class="agui-console__actions">
                            <button type="submit" class="btn btn-primary" data-agui-approve>
                                <core:icon identifier="actions-check" size="small" />
                                <f:translate domain="agent_nexus.agui" key="console.approve" />
                            </button>
                            <button type="button" class="btn btn-default" data-agui-reject>
                                <core:icon identifier="actions-close" size="small" />
                                <f:translate domain="agent_nexus.agui" key="console.reject" />
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card" aria-labelledby="agui-state-heading">
                <div class="card-header">
                    <h2 class="card-title" id="agui-state-heading"><f:translate domain="agent_nexus.agui" key="console.state" /></h2>
                </div>
                <div class="card-body">
                    <pre class="anx-code" tabindex="0" aria-label="{f:translate(domain: 'agent_nexus.agui', key: 'console.state')}"><code data-agui-state></code></pre>
                    <h3 class="agui-console__subheading"><f:translate domain="agent_nexus.agui" key="console.deltas" /></h3>
                    <p class="text-variant" data-agui-deltas-empty><f:translate domain="agent_nexus.agui" key="console.deltas.empty" /></p>
                    <ol class="agui-console__deltas" data-agui-deltas></ol>
                </div>
            </section>

            <section class="card" data-agui-activity-card hidden aria-labelledby="agui-activity-heading">
                <div class="card-header">
                    <h2 class="card-title" id="agui-activity-heading"><f:translate domain="agent_nexus.agui" key="console.activity" /></h2>
                </div>
                <div class="card-body">
                    <pre class="anx-code" tabindex="0" aria-label="{f:translate(domain: 'agent_nexus.agui', key: 'console.activity')}"><code data-agui-activity></code></pre>
                </div>
            </section>
        </div>
    </div>

    <section class="anx-section" aria-labelledby="agui-recent-heading">
        <div class="agui-console__section-head">
            <h2 id="agui-recent-heading"><f:translate domain="agent_nexus.agui" key="console.recent" /></h2>
            <f:if condition="{inspectorUri}">
                <a class="btn btn-default btn-sm" href="{inspectorUri}">
                    <core:icon identifier="agentnexus-module-inspector" size="small" />
                    <f:translate domain="agent_nexus.agui" key="console.recent.all" />
                </a>
            </f:if>
        </div>
        <f:if condition="{recentRuns}">
            <f:then>
                <div class="table-fit">
                    <table class="table table-striped table-hover">
                        <caption class="visually-hidden"><f:translate domain="agent_nexus.agui" key="console.recent" /></caption>
                        <thead>
                            <tr>
                                <th scope="col"><f:translate domain="agent_nexus.agui" key="console.recent.run" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.agui" key="console.recent.label" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.agui" key="console.recent.state" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.agui" key="console.recent.source" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.agui" key="console.recent.events" /></th>
                                <th scope="col"><f:translate domain="agent_nexus.agui" key="console.recent.updated" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{recentRuns}" as="run">
                                <tr>
                                    <td>
                                        <f:if condition="{run.detailUri}">
                                            <f:then><a href="{run.detailUri}" title="{f:translate(domain: 'agent_nexus.agui', key: 'console.recent.open', arguments: '{0: run.runId}')}"><code>{run.runId}</code></a></f:then>
                                            <f:else><code>{run.runId}</code></f:else>
                                        </f:if>
                                    </td>
                                    <td>{run.label}</td>
                                    <td><span class="badge badge-{run.badge}"><f:translate domain="agent_nexus.agui" key="state.{run.state}" default="{run.state}" /></span></td>
                                    <td><f:translate domain="agent_nexus.agui" key="source.{run.source}" default="{run.source}" /></td>
                                    <td>{run.events}</td>
                                    <td><time datetime="{f:format.date(date: '@{run.updated}', format: 'c')}"><f:format.date format="Y-m-d H:i:s">@{run.updated}</f:format.date></time></td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <div class="anx-empty">
                    <core:icon identifier="agentnexus-module-agui" size="large" />
                    <p class="anx-empty__title"><f:translate domain="agent_nexus.agui" key="console.recent.empty.title" /></p>
                    <p><f:translate domain="agent_nexus.agui" key="console.recent.empty" /></p>
                </div>
            </f:else>
        </f:if>
    </section>

    <f:if condition="{demoUrl}">
        <p class="anx-section">
            <a class="btn btn-default" href="{demoUrl}" target="_blank" rel="noopener">
                <core:icon identifier="actions-view-page" size="small" />
                <f:translate domain="agent_nexus.agui" key="console.demo" />
                <span class="visually-hidden"><f:translate domain="agent_nexus.agui" key="console.newTab" /></span>
            </a>
        </p>
    </f:if>
</div>
</f:section>

</html>
