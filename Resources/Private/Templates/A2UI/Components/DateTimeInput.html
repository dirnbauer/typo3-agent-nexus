<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="mb-3">
    <f:if condition="{props.label}">
        <label class="form-label" for="{id}">{props.label}<f:if condition="{props.required}"> <span class="text-danger">*</span></f:if></label>
    </f:if>
    <input
        type="<f:switch expression='{props.mode}'><f:case value='datetime'>datetime-local</f:case><f:case value='time'>time</f:case><f:defaultCase>date</f:defaultCase></f:switch>"
        class="form-control"
        id="{id}"
        name="{id}"
        value="{value}"
        data-a2ui-bind="{path}"
        <f:if condition="{props.min}">min="{props.min}"</f:if>
        <f:if condition="{props.max}">max="{props.max}"</f:if>
        <f:if condition="{props.required}">required</f:if>
    />
    <f:if condition="{props.helpText}"><div class="form-text">{props.helpText}</div></f:if>
</div>
</html>
