<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="mb-3">
    <f:if condition="{props.label}">
        <label class="form-label" for="{id}">{props.label}<f:if condition="{props.required}"> <span class="text-danger">*</span></f:if></label>
    </f:if>
    <select
        class="form-select"
        id="{id}"
        name="{id}"
        data-a2ui-bind="{path}"
        <f:if condition="{props.multiple}">multiple</f:if>
        <f:if condition="{props.required}">required</f:if>
    >
        <f:for each="{props.options}" as="option">
            <f:variable name="optValue" value="{f:if(condition: option.value, then: option.value, else: option)}" />
            <f:variable name="optLabel" value="{f:if(condition: option.label, then: option.label, else: option)}" />
            <option value="{optValue}"<f:if condition="{optValue} == {value}"> selected</f:if>>{optLabel}</option>
        </f:for>
    </select>
    <f:if condition="{props.helpText}"><div class="form-text">{props.helpText}</div></f:if>
</div>
</html>
