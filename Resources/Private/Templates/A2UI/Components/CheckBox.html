<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="form-check mb-3">
    <input
        type="checkbox"
        class="form-check-input"
        id="{id}"
        name="{id}"
        value="1"
        data-a2ui-bind="{path}"
        <f:if condition="{value}">checked</f:if>
    />
    <f:if condition="{props.label}"><label class="form-check-label" for="{id}">{props.label}</label></f:if>
    <f:if condition="{props.helpText}"><div class="form-text">{props.helpText}</div></f:if>
</div>
</html>
