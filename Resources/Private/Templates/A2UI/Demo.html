<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">

<div class="a2ui-demo" style="max-width: 1200px;">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h1 class="mb-1">Component Gallery</h1>
            <p class="text-body-secondary mb-0">
                Each example below is an A2UI v1.0 surface rendered <strong>server-side</strong> (no JavaScript).
                The same surfaces render live and interactively in the playground.
            </p>
        </div>
        <a href="{f:uri.action(action: 'dashboard')}" class="btn btn-outline-secondary btn-sm">
            <core:icon identifier="actions-arrow-left" size="small" /> Back to playground
        </a>
    </div>

    <f:for each="{examples}" as="example" key="title">
        <div class="card mb-4">
            <div class="card-header"><h2 class="h5 mb-0">{title}</h2></div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-lg-6">
                        <div class="text-uppercase small text-body-secondary mb-2">Rendered</div>
                        <div class="border rounded p-3">
                            <f:format.raw>{example.html}</f:format.raw>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="text-uppercase small text-body-secondary mb-2">A2UI v1.0 JSON</div>
                        <pre class="a2ui-code"><code>{example.json}</code></pre>
                    </div>
                </div>
            </div>
        </div>
    </f:for>
</div>

</f:section>

</html>
