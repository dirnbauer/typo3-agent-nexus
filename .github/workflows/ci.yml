name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Audit dependencies
        run: composer update --no-install --no-interaction && composer audit --no-dev --locked

      - name: Lint PHP
        run: |
          find Classes Configuration Tests ext_localconf.php -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Lint YAML, XLIFF, FlexForms, SVG and JSON
        run: |
          python3 - <<'PY'
          import glob, json, sys, xml.etree.ElementTree as ET
          import importlib.util
          if importlib.util.find_spec('yaml'):
              import yaml
              for f in glob.glob('Configuration/**/*.yaml', recursive=True):
                  yaml.safe_load(open(f))
          for pattern in ('Resources/Private/Language/*.xlf', 'Configuration/FlexForms/*.xml',
                          'Resources/Public/Icons/*.svg', 'Resources/Public/Diagrams/*.svg'):
              for f in glob.glob(pattern):
                  ET.parse(f)
          for f in glob.glob('Tests/Conformance/Schemas/**/*.json', recursive=True) + glob.glob('Resources/Private/Schemas/**/*.json', recursive=True):
              json.load(open(f))
          # Every English label file has a German twin with the same units.
          ns = {'x': 'urn:oasis:names:tc:xliff:document:2.0'}
          for f in glob.glob('Resources/Private/Language/locallang*.xlf'):
              de = f.replace('/locallang', '/de.locallang')
              units = lambda p: {u.get('id') for u in ET.parse(p).getroot().iter('{urn:oasis:names:tc:xliff:document:2.0}unit')}
              missing = units(f) - units(de)
              if missing:
                  sys.exit(f'{de} lacks {sorted(missing)}')
          print('ok')
          PY

  cgl:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: composer ci:cgl

  phpstan:
    name: PHPStan level 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: composer ci:phpstan

  unit:
    name: Unit and conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
          tools: composer:v2
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: composer ci:tests:unit

  functional:
    name: Functional (PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            database: mariadb
          - php: '8.5'
            database: sqlite
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pdo_sqlite, openssl
          tools: composer:v2
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Run functional tests (MariaDB)
        if: matrix.database == 'mariadb'
        env:
          typo3DatabaseDriver: mysqli
          typo3DatabaseHost: 127.0.0.1
          typo3DatabasePort: 3306
          typo3DatabaseName: func_test
          typo3DatabaseUsername: root
          typo3DatabasePassword: root
        run: composer ci:tests:functional

      - name: Run functional tests (SQLite)
        if: matrix.database == 'sqlite'
        env:
          typo3DatabaseDriver: pdo_sqlite
        run: composer ci:tests:functional

  diagrams:
    name: Diagrams are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Hash check, not a re-render: mermaid sizes a sequence diagram from
      # measured text, so fonts and the Chromium build decide the geometry and
      # a runner cannot reproduce the author's viewBox. Build/diagrams.lock.json
      # records the hash of every source, of the renderer and of every SVG, so
      # this still catches an edited .mmd that was never re-rendered and a
      # hand-edited SVG — without installing node modules or a browser.
      - name: Check the diagrams against their sources
        run: npm run diagrams:check
